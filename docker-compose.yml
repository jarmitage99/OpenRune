services:
  linux:
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    build: docker/linux
    image: rune-build-linux
    volumes:
      - .:/src
      - ccache:/ccache
    command:
      - sh
      - -euc
      - |
        cmake -S . -B build-docker -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_QA=ON
        cmake --build build-docker --parallel

  web:
    user: "${UID:-1000}:${GID:-1000}"
    working_dir: /src
    build: docker/emscripten
    image: rune-build-web
    volumes:
      - .:/src
      - type: bind
        source: ${RUNE_GAME_DATA:-./demo-data}
        target: /demo-data
        read_only: true
        bind:
          create_host_path: false
      - ccache:/ccache
      - emcache:/emcache
    command:
      - sh
      - -euc
      - |
        emcmake cmake -S . -B build-web -G Ninja -DCMAKE_BUILD_TYPE=Release -DSKIP_QA=ON -DSKIP_UT=ON -DRUNE_GAME_DATA=/demo-data
        cmake --build build-web --target rune --parallel

volumes:
  ccache:
  emcache:
